services:
  postgres:
    image: postgres:16
    container_name: enterprise_ai_postgres_deploy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai}
      POSTGRES_USER: ${POSTGRES_USER:-enterprise_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enterprise_password}
    ports:
      - "5432:5432"
    volumes:
      - enterprise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enterprise_user} -d ${POSTGRES_DB:-enterprise_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: enterprise_ai_neo4j_deploy
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-enterprise_neo4j_password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - enterprise_neo4j_data:/data
      - enterprise_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise_ai_qdrant_deploy
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - enterprise_qdrant_storage:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: enterprise_ai_api
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_HOST: qdrant
      QDRANT_HTTP_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      OBSERVABILITY_DIR: reports/observability
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: enterprise_ai_ui
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  enterprise_postgres_data:
  enterprise_neo4j_data:
  enterprise_neo4j_logs:
  enterprise_qdrant_storage: