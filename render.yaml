# Render blueprint for the demo deployment (M8 Task 2).
#
# Two free web services, both built from Dockerfiles already in this repository. No
# database is provisioned because demo mode does not have one: the API replays
# demo/scenarios.json and is built from requirements-demo.txt, which does not install
# torch, google-genai, or any database driver.
#
# That is what makes this deployable for nothing and leaves nothing to protect: no
# Gemini key on a public host, no corpus to migrate, no bill that can run away.
#
# Apply it: Render dashboard -> New -> Blueprint -> pick this repository.
#
# Known behaviour of the free instance type, stated here rather than discovered later:
#   * A service spins down after 15 minutes without traffic and takes roughly a minute
#     to answer the next request. The first page load after a quiet period is slow.
#   * 750 instance-hours per workspace per calendar month, shared across both services.
#     Two services running continuously would need ~1,460, so the spin-down is what
#     keeps this inside the allowance rather than a detail to work around.
#   * Free instances are explicitly documented as unsuitable for production.

services:
  - type: web
    name: enterprise-ai-demo-api
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    plan: free
    region: frankfurt
    # Pinned explicitly. Without it a service tracks the repository's default branch
    # regardless of which branch the blueprint was read from -- which is how the first
    # deploy ended up building from a `main` that had no Dockerfile.demo: the API
    # never built (Render answered `x-render-routing: no-server`) while the UI built
    # from main's pre-M8 Dockerfile and served the old page against a dead API.
    branch: main
    healthCheckPath: /health
    # A push to main redeploys. It was false to avoid surprise deploys, but combined
    # with the branch mistake above it also meant the fix for a broken deploy would
    # not have shipped without a manual click.
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "true"
      # Nothing writes spans in demo mode -- the traces served are the recorded ones
      # in the bundle -- so the exporter has no work to do.
      - key: OTEL_EXPORTER
        value: none
      # Deliberately absent: GEMINI_API_KEY, API_BEARER_TOKEN, and every database
      # credential. Demo mode authenticates nothing because there is nothing behind
      # the gate to bill or to reach, and an absent key is a stronger guarantee than
      # a code path that promises not to use one.

  - type: web
    name: enterprise-ai-demo-ui
    runtime: docker
    dockerfilePath: ./Dockerfile.ui
    dockerContext: .
    plan: free
    region: frankfurt
    # Pinned explicitly. Without it a service tracks the repository's default branch
    # regardless of which branch the blueprint was read from -- which is how the first
    # deploy ended up building from a `main` that had no Dockerfile.demo: the API
    # never built (Render answered `x-render-routing: no-server`) while the UI built
    # from main's pre-M8 Dockerfile and served the old page against a dead API.
    branch: main
    healthCheckPath: /_stcore/health
    # A push to main redeploys. It was false to avoid surprise deploys, but combined
    # with the branch mistake above it also meant the fix for a broken deploy would
    # not have shipped without a manual click.
    autoDeploy: true
    envVars:
      # Set these in the dashboard, once, to the API service's PUBLIC url --
      # https://<api-service>.onrender.com. Render prompts for `sync: false` values
      # when the blueprint is applied.
      #
      # This cannot be derived from the blueprint, for two independent reasons:
      #
      #   1. `fromService` offers only `host`, `port` and `hostport`, and all three
      #      are private-network addresses. There is no property for a public URL.
      #   2. Even if there were, the private network is not an option here: Render
      #      documents that "free web services can send private network requests, but
      #      they can't receive them". Two free services cannot talk privately at all.
      #
      # The first attempt used `property: host`, which handed the UI the bare service
      # name `enterprise-ai-demo-api-77mb` and produced
      # `NameResolutionError: Failed to resolve 'enterprise-ai-demo-api-77mb'`.
      #
      # It also cannot be hardcoded: Render appends a random suffix when the service
      # name is already taken globally, so the hostname is not knowable until the
      # service exists.
      - key: API_BASE_URL
        sync: false
      # The same value. Kept separate because in a paid deployment behind a reverse
      # proxy the internal address and the address a visitor's browser must reach for
      # the trace links are genuinely different.
      - key: PUBLIC_API_BASE_URL
        sync: false
