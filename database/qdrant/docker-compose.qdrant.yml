services:
  qdrant:
    image: qdrant/qdrant
    container_name: enterprise_ai_qdrant
    restart: unless-stopped

    ports:
      - "${QDRANT_HTTP_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"

    volumes:
      - enterprise_ai_qdrant_storage:/qdrant/storage

volumes:
  enterprise_ai_qdrant_storage: