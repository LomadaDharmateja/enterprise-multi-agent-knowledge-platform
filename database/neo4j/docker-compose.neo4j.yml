services:
  neo4j:
    image: neo4j:5-community
    container_name: enterprise_ai_neo4j
    restart: unless-stopped

    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*

    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"

    volumes:
      - enterprise_ai_neo4j_data:/data
      - enterprise_ai_neo4j_logs:/logs
      - enterprise_ai_neo4j_import:/var/lib/neo4j/import
      - enterprise_ai_neo4j_plugins:/plugins

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USERNAME} -p ${NEO4J_PASSWORD} 'RETURN 1;'"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  enterprise_ai_neo4j_data:
  enterprise_ai_neo4j_logs:
  enterprise_ai_neo4j_import:
  enterprise_ai_neo4j_plugins: