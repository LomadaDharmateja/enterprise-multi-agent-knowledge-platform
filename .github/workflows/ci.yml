name: CI

on:
  # Every branch, not just main. The previous filter was `branches: [main]`, and
  # M2 through M8 were each developed and committed on their own branch without a
  # pull request -- so seven milestones of work never ran CI once. The gate existed
  # and guarded nothing. The failure that finally appeared did so only when main was
  # fast-forwarded at the end of M8, seven milestones after it was introduced.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest (python 3.12, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # test_repo_hygiene.py shells out to `git ls-files`, so it needs real history.
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned runtime dependencies
        # Installing the full pinned requirements.txt on a clean Linux runner is
        # itself the check that the pins resolve away from the author's machine.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Show resolved environment
        run: pip freeze

      - name: Run pytest
        run: pytest -ra -v
